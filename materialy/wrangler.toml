name = "stemlab-materialy"
main = "src/index.js"
compatibility_date = "2025-09-01"

# Worker beží priamo na subdoméne – DNS záznam vytvorí Cloudflare sám.
routes = [{ pattern = "materialy.stemlab.sk", custom_domain = true }]

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "stemlab-materialy"

[vars]
SITE_TITLE = "STEMlab – materiály"
