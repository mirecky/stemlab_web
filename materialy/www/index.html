<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>STEMlab – materiály</title>
<style>
:root { --bg:#fafafa; --fg:#1d1d1f; --muted:#6b6b70; --line:#e3e3e6; --link:#0b63c5; --hover:#f0f3f8; }
@media (prefers-color-scheme: dark) {
  :root { --bg:#121214; --fg:#ececef; --muted:#9a9aa2; --line:#2a2a2f; --link:#6cb0ff; --hover:#1c1f26; }
}
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
main { max-width: 960px; margin: 0 auto; padding: 24px 16px 48px; }
h1 { font-size: 1.5rem; margin: 0 0 4px; word-break: break-word; }
.crumbs { color: var(--muted); margin-bottom: 20px; word-break: break-word; }
.crumbs .sep { margin: 0 6px; }
a { color: var(--link); text-decoration: none; }
a:hover { text-decoration: underline; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-weight: 600; color: var(--muted); font-size: .85rem; border-bottom: 1px solid var(--line); padding: 8px; }
td { border-bottom: 1px solid var(--line); padding: 8px; vertical-align: middle; }
tbody tr:hover { background: var(--hover); }
td:first-child { word-break: break-word; }
.num { text-align: right; white-space: nowrap; color: var(--muted); font-variant-numeric: tabular-nums; }
.icon { display: inline-block; width: 1.6em; }
.empty { color: var(--muted); text-align: center; padding: 32px 8px; }
@media (max-width: 560px) { th:nth-child(3), td:nth-child(3) { display: none; } }
</style>
</head>
<body>
<main>
<h1 id="nadpis">STEMlab – materiály</h1>
<nav class="crumbs" id="cesta"></nav>
<table>
<thead><tr><th>Názov</th><th class="num">Veľkosť</th><th class="num">Upravené</th></tr></thead>
<tbody id="obsah"><tr><td colspan="3" class="empty">Načítavam…</td></tr></tbody>
</table>
</main>
<script>
// Obsah zložky dodáva nginx (autoindex_format json) na /_zoznam/<cesta>.
const TITLE = "STEMlab – materiály";
const path = location.pathname; // vždy končí "/"
const parts = path.split("/").filter(Boolean).map(decodeURIComponent);

const ICONS = {
  pdf: "📕", doc: "📝", docx: "📝", odt: "📝", txt: "📝", md: "📝",
  xls: "📊", xlsx: "📊", ods: "📊", csv: "📊",
  ppt: "📽️", pptx: "📽️", odp: "📽️",
  png: "🖼️", jpg: "🖼️", jpeg: "🖼️", gif: "🖼️", svg: "🖼️", webp: "🖼️",
  mp4: "🎬", webm: "🎬", mov: "🎬", mp3: "🎵",
  zip: "🗜️", rar: "🗜️", "7z": "🗜️",
  py: "💻", ino: "💻", c: "💻", cpp: "💻", h: "💻", js: "💻", html: "💻",
};

function el(tag, props = {}, ...children) {
  const node = Object.assign(document.createElement(tag), props);
  node.append(...children);
  return node;
}

function formatSize(bytes) {
  const units = ["B", "kB", "MB", "GB"];
  let i = 0, n = bytes;
  while (n >= 1024 && i < units.length - 1) { n /= 1024; i++; }
  return `${i === 0 ? n : n.toFixed(1).replace(".", ",")} ${units[i]}`;
}

const dateFmt = new Intl.DateTimeFormat("sk-SK", { day: "numeric", month: "numeric", year: "numeric" });
const collator = new Intl.Collator("sk", { numeric: true, sensitivity: "base" });

function renderHeader() {
  const heading = parts.length ? parts[parts.length - 1] : TITLE;
  document.getElementById("nadpis").textContent = heading;
  document.title = parts.length ? `${heading} · ${TITLE}` : TITLE;

  const nav = document.getElementById("cesta");
  nav.append(el("a", { href: "/", textContent: "Materiály" }));
  let href = "/";
  for (const part of parts) {
    href += encodeURIComponent(part) + "/";
    nav.append(el("span", { className: "sep", textContent: "/" }), el("a", { href, textContent: part }));
  }
}

function row(name, href, icon, size, mtime) {
  return el("tr", {},
    el("td", {}, el("a", { href }, el("span", { className: "icon", ariaHidden: "true", textContent: icon }), name)),
    el("td", { className: "num", textContent: size }),
    el("td", { className: "num", textContent: mtime }),
  );
}

function message(text) {
  return el("tr", {}, el("td", { colSpan: 3, className: "empty", textContent: text }));
}

async function load() {
  renderHeader();
  const body = document.getElementById("obsah");
  let items;
  try {
    const res = await fetch("/_zoznam" + path, { cache: "no-cache" });
    if (res.status === 404) { body.replaceChildren(message("Táto zložka neexistuje.")); document.title = "Nenájdené · " + TITLE; return; }
    if (!res.ok) throw new Error(res.status);
    items = await res.json();
  } catch {
    body.replaceChildren(message("Obsah sa nepodarilo načítať. Skúste obnoviť stránku."));
    return;
  }

  const folders = items.filter((i) => i.type === "directory").sort((a, b) => collator.compare(a.name, b.name));
  const files = items.filter((i) => i.type !== "directory").sort((a, b) => collator.compare(a.name, b.name));

  const rows = [];
  if (parts.length) rows.push(el("tr", {}, el("td", { colSpan: 3 }, el("a", { href: "../", textContent: "← o úroveň vyššie" }))));
  for (const f of folders) rows.push(row(f.name, encodeURIComponent(f.name) + "/", "📁", "—", "—"));
  for (const f of files) {
    const ext = f.name.includes(".") ? f.name.split(".").pop().toLowerCase() : "";
    rows.push(row(f.name, encodeURIComponent(f.name), ICONS[ext] || "📄", formatSize(f.size), dateFmt.format(new Date(f.mtime))));
  }
  if (!folders.length && !files.length) rows.push(message("Zatiaľ tu nič nie je."));
  body.replaceChildren(...rows);
}

load();
</script>
</body>
</html>
