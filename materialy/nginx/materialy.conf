# materialy.stemlab.sk – read-only prehliadač materiálov.
# Cloudflare tunel posiela materialy.stemlab.sk na http://localhost:8080.
# Cesty __MATERIALY_DIR__ a __UI_DIR__ doplní install.sh.

server {
    listen 127.0.0.1:8080;
    server_name materialy.stemlab.sk;

    root __MATERIALY_DIR__;
    charset utf-8;
    absolute_redirect off;   # za tunelom posielať relatívne presmerovania (bez :8080)
    server_tokens off;

    # Iba čítanie.
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }

    # Skryté súbory a zložky (.nieco) nikdy neposielať.
    location ~ /\. { return 404; }

    # Zoznam obsahu zložky ako JSON pre prehliadač (www/index.html).
    # ^~ = má prednosť pred regex lokáciami nižšie.
    location ^~ /_zoznam/ {
        alias __MATERIALY_DIR__/;
        index __ziadny_index__;   # aj zložka s index.html sa vypíše ako zoznam
        autoindex on;
        autoindex_format json;
        add_header Cache-Control "no-cache";
        location ~ /\. { return 404; }
    }

    # Každá adresa zložky (končí lomkou) → stránka prehliadača.
    location ~ /$ {
        root __UI_DIR__;
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
    }

    # Samotné súbory (nginx sám rieši Range, ETag, 304 a presmerovanie zložky bez lomky).
    location / {
        add_header Cache-Control "public, max-age=300";
        add_header X-Content-Type-Options nosniff;
    }
}
